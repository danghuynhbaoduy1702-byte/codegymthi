<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý công nhân</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h2 { text-align: center; }
        table { width: 80%; margin: 0 auto; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Quản lý công nhân</h2>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ và tên</th>
                <th>Ngày sinh</th>
                <th>Địa chỉ</th>
                <th>Lương</th>
                <th>Chức vụ</th>
            </tr>
        </thead>
        <tbody id="danhSachCongNhan">
           
        </tbody>
    </table>

    <script>
    
        class CongNhan {
            constructor(stt, hoTen, ngaySinh, diaChi, luong, chucVu) {
                this.stt = stt;
                this.hoTen = hoTen;
                this.ngaySinh = ngaySinh;
                this.diaChi = diaChi;
                this.luong = luong;
                this.chucVu = chucVu;
            }
        }

        let dsCongNhan = [
            new CongNhan(1, "Trương Tấn A", "11-11-1997", "Quảng Nam", 2000, "Abc"),
            new CongNhan(2, "Trương Tấn C", "11-11-1999", "Huế", 2000, "Abc"),
            new CongNhan(3, "Trương Tấn B", "11-11-1998", "Đà Nẵng", 2000, "Abc")
        ];

        function hienThi() {
        
            dsCongNhan.sort((a, b) => a.hoTen.localeCompare(b.hoTen));

            let html = "";
            for (let i = 0; i < dsCongNhan.length; i++) {
                html += `
                    <tr>
                        <td>${i + 1}</td>
                        <td style="text-align: left;">${dsCongNhan[i].hoTen}</td>
                        <td>${dsCongNhan[i].ngaySinh}</td>
                        <td>${dsCongNhan[i].diaChi}</td>
                        <td>${dsCongNhan[i].luong}</td>
                        <td>${dsCongNhan[i].chucVu}</td>
                    </tr>
                `;
            }

            document.getElementById("danhSachCongNhan").innerHTML = html;
        }

        
        hienThi();
    </script>

</body>
</html>
